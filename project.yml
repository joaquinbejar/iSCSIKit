name: iSCSIKit
options:
  bundleIdPrefix: com.taunais
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5NP3LPSUMR

targets:
  iSCSIKitDext:
    type: driver-extension
    platform: macOS
    sources:
      - path: Dext
        includes:
          - "*.iig"
          - "*.cpp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.iscsi-initiator.dext
        PRODUCT_NAME: com.taunais.iscsi-initiator.dext
        INFOPLIST_FILE: Dext/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Dext/Dext.entitlements
        HEADER_SEARCH_PATHS: $(SRCROOT)/Daemon/Sources/CISCSIKitShared/include
        SDKROOT: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "23.0"
        OTHER_LDFLAGS: ["-framework", "SCSIControllerDriverKit"]

  iSCSIKit:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "LaunchAgents/*"
      - path: App/AppIcon.icns
        buildPhase: resources
      - path: App/LaunchAgents/com.taunais.iscsikit.daemon.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: iSCSIKitDext
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar Garcia. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.iscsi-initiator
        PRODUCT_NAME: iSCSIKit
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
    postBuildScripts:
      - name: Embed iscsikitd
        script: |
          set -e
          export PATH="/opt/homebrew/bin:$PATH"
          export PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig
          cd "$SRCROOT/Daemon"
          swift build -c release
          mkdir -p "$CODESIGNING_FOLDER_PATH/Contents/MacOS" "$CODESIGNING_FOLDER_PATH/Contents/Frameworks"
          cp -f .build/release/iscsikitd "$CODESIGNING_FOLDER_PATH/Contents/MacOS/"
          # Bundle libiscsi: hardened-runtime binaries cannot load Homebrew's
          # ad-hoc-signed dylib (different team ID).
          LIBISCSI=$(readlink -f /opt/homebrew/opt/libiscsi/lib/libiscsi.11.dylib)
          cp -f "$LIBISCSI" "$CODESIGNING_FOLDER_PATH/Contents/Frameworks/libiscsi.11.dylib"
          install_name_tool -change /opt/homebrew/opt/libiscsi/lib/libiscsi.11.dylib \
            @executable_path/../Frameworks/libiscsi.11.dylib \
            "$CODESIGNING_FOLDER_PATH/Contents/MacOS/iscsikitd" 2>/dev/null || true
          if [ "$CODE_SIGNING_ALLOWED" = "YES" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --options runtime \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$CODESIGNING_FOLDER_PATH/Contents/Frameworks/libiscsi.11.dylib"
            codesign --force --options runtime \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$CODESIGNING_FOLDER_PATH/Contents/MacOS/iscsikitd"
          fi

schemes:
  iSCSIKit:
    build:
      targets:
        iSCSIKit: all
    run:
      config: Debug
