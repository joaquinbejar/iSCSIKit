name: iSCSIKit
options:
  bundleIdPrefix: com.taunais
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5NP3LPSUMR

targets:
  iSCSIKitDext:
    type: driver-extension
    platform: macOS
    sources:
      - path: Dext
        includes:
          - "*.iig"
          - "*.cpp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.iscsi-initiator.dext
        PRODUCT_NAME: com.taunais.iscsi-initiator.dext
        INFOPLIST_FILE: Dext/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS: $(SRCROOT)/Daemon/Sources/CISCSIKitShared/include
        SDKROOT: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "23.0"
        OTHER_LDFLAGS: ["-framework", "SCSIControllerDriverKit"]
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Dext/Dext.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Dext/Dext-DeveloperID.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: iSCSIKit DExt Developer ID
          OTHER_CODE_SIGN_FLAGS: --timestamp
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  iSCSIKit:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "LaunchAgents/*"
      - path: App/AppIcon.icns
        buildPhase: resources
      - path: App/LaunchAgents/com.taunais.iscsikit.daemon.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: iSCSIKitDext
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar Garcia. MIT License."
        NSLocalNetworkUsageDescription: "iSCSIKit connects to iSCSI targets on your local network to present their storage as disks."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.iscsi-initiator
        PRODUCT_NAME: iSCSIKit
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: iSCSIKit App Developer ID
          OTHER_CODE_SIGN_FLAGS: --timestamp
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postBuildScripts:
      - name: Embed iscsikitd
        script: |
          set -e
          export PATH="/opt/homebrew/bin:$PATH"
          export PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig
          cd "$SRCROOT/Daemon"
          swift build -c release
          # Package the daemon as a nested .app bundle so it can carry its own
          # embedded provisioning profile — a restricted DriverKit entitlement
          # (userclient-access) on a bare CLI tool is SIGKILLed by AMFI at
          # launch; only a bundle with embedded.provisionprofile is honored.
          DAPP="$CODESIGNING_FOLDER_PATH/Contents/Library/iSCSIKitDaemon.app"
          rm -rf "$DAPP"
          mkdir -p "$DAPP/Contents/MacOS" "$DAPP/Contents/Frameworks"
          cp -f .build/release/iscsikitd "$DAPP/Contents/MacOS/iSCSIKitDaemon"
          cp -f "$SRCROOT/Daemon/DaemonBundle-Info.plist" "$DAPP/Contents/Info.plist"
          # Bundle libiscsi: hardened-runtime binaries cannot load Homebrew's
          # ad-hoc-signed dylib (different team ID).
          LIBISCSI=$(readlink -f /opt/homebrew/opt/libiscsi/lib/libiscsi.11.dylib)
          cp -f "$LIBISCSI" "$DAPP/Contents/Frameworks/libiscsi.11.dylib"
          install_name_tool -change /opt/homebrew/opt/libiscsi/lib/libiscsi.11.dylib \
            @executable_path/../Frameworks/libiscsi.11.dylib \
            "$DAPP/Contents/MacOS/iSCSIKitDaemon" 2>/dev/null || true
          PROFILE="$SRCROOT/Daemon/signing/DaemonDeveloperID.provisionprofile"
          DEXT_ID="com.taunais.iscsi-initiator.dext"
          if [ "$CONFIGURATION" = "Release" ]; then
            # The kernel only lets the daemon open the dext if the daemon's
            # userclient-access lists the dext bundle ID, and AMFI only honors
            # that entitlement when the embedded profile authorizes the same
            # value. A Release build missing either signs and notarizes fine
            # but fails IOServiceOpen for every user, so refuse to produce it.
            if [ ! -f "$PROFILE" ]; then
              echo "error: $PROFILE is missing; download the 'iSCSIKit Daemon Developer ID' profile there" >&2
              exit 1
            fi
            if ! security cms -D -i "$PROFILE" 2>/dev/null \
                | plutil -extract Entitlements xml1 -o - - \
                | grep -q "<string>$DEXT_ID</string>"; then
              echo "error: $PROFILE does not authorize userclient-access for $DEXT_ID; regenerate it once Apple adds the dext bundle ID to the team's allowed values" >&2
              exit 1
            fi
            cp -f "$PROFILE" "$DAPP/Contents/embedded.provisionprofile"
          fi
          if [ "$CODE_SIGNING_ALLOWED" = "YES" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --options runtime --timestamp \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$DAPP/Contents/Frameworks/libiscsi.11.dylib"
            DAEMON_ENTS=""
            if [ "$CONFIGURATION" = "Release" ]; then
              DAEMON_ENTS="--entitlements $SRCROOT/Daemon/Daemon-DeveloperID.entitlements"
            fi
            # Sign the nested bundle; --entitlements applies to its main
            # executable, and the embedded profile authorizes them.
            codesign --force --options runtime --timestamp \
              --identifier com.taunais.iscsi-initiator.daemon \
              $DAEMON_ENTS \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$DAPP"
            if [ "$CONFIGURATION" = "Release" ] && ! codesign -d --entitlements - --xml "$DAPP" 2>/dev/null \
                | grep -q "<string>$DEXT_ID</string>"; then
              echo "error: signed daemon does not carry userclient-access for $DEXT_ID" >&2
              exit 1
            fi
          fi

schemes:
  iSCSIKit:
    build:
      targets:
        iSCSIKit: all
    run:
      config: Debug
